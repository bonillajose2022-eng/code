function remaining(s,now=Date.now()){return s.running?Math.max(0,Math.ceil((s.deadline-now)/1000)):s.remaining;}
function pause(s,now=Date.now()){const r=remaining(s,now);if(s.running)s.elapsed+=Math.max(0,s.remaining-r);s.remaining=r;s.running=false;s.deadline=null;}
function start(s,now=Date.now()){if(!s.running&&s.remaining>0&&!s.won){s.running=true;s.deadline=now+s.remaining*1000;}}
function score(s){return s.won?100:Math.max(25,Math.min(75,s.completed*25));}
function canOpen(s,index){return Number.isInteger(index)&&index>=0&&index<4&&index<=s.completed;}
function verify(s,index,value,correct,{teacherMode=false,approved=false}={}){if(remaining(s)<=0)return 'expired';if(s.won||index!==s.completed||index>3)return 'locked';if(!/^\d$/.test(value))return 'invalid';if(!approved)s.attempts[index]++;if(Number(value)!==correct)return 'wrong';if(teacherMode&&!approved)return 'approval';s.digits.push(value);s.completed++;s.current=Math.min(3,s.completed);return 'correct';}
function unlockVault(s,code,expected){if(remaining(s)<=0)return 'expired';if(s.completed!==4)return 'locked';if(!/^\d{4}$/.test(code)||code!==expected)return 'wrong';pause(s);s.won=true;return 'correct';}

const plain=s=>String(s).normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[–—]/g,'-').replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/[^\x20-\x7e\n]/g,'?');
function downloadPDF(name,lines){let wrapped=[];for(const input of lines){for(const line of plain(input).split('\n')){let rest=line;while(rest.length>88){let at=rest.lastIndexOf(' ',88);if(at<1)at=88;wrapped.push(rest.slice(0,at));rest=rest.slice(at).trimStart();}wrapped.push(rest);}}const pages=[];for(let i=0;i<wrapped.length;i+=46)pages.push(wrapped.slice(i,i+46));if(!pages.length)pages.push([]);const objects=['<< /Type /Catalog /Pages 2 0 R >>','', '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>'];let kids=[];pages.forEach((lines,i)=>{const page=objects.length+1,stream=page+1;kids.push(`${page} 0 R`);objects.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R >> >> /Contents ${stream} 0 R >>`);const escape=s=>s.replace(/([\\()])/g,'\\$1');const text=`0.12 0.2 0.18 rg\nBT /F1 10 Tf 48 792 Td 15 TL\n`+lines.map((line,j)=>`${j?'T* ':''}(${escape(line)}) Tj`).join('\n')+`\nET\nBT /F1 9 Tf 48 32 Td (ASPAEN NEIVA | CLASSIFIED MISSION REPORT | ${i+1}/${pages.length}) Tj ET`;objects.push(`<< /Length ${text.length} >>\nstream\n${text}\nendstream`);});objects[1]=`<< /Type /Pages /Count ${pages.length} /Kids [${kids.join(' ')}] >>`;let pdf='%PDF-1.4\n',offsets=[0];objects.forEach((o,i)=>{offsets.push(pdf.length);pdf+=`${i+1} 0 obj\n${o}\nendobj\n`;});const xref=pdf.length;pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`+offsets.slice(1).map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;const url=URL.createObjectURL(new Blob([pdf],{type:'application/pdf'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}

async function hash(pin){if(!crypto.subtle)throw Error('A secure HTTPS connection is required to configure the teacher PIN.');return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pin)))).map(x=>x.toString(16).padStart(2,'0')).join('');}
function teacherGate(action=null,review=false){if(teacherSession&&!action)return dashboard();const setup=!db.settings.pinHash;modal(`<p class="eyebrow">LOCAL TEACHER ACCESS</p><h2>${setup?'Set your teacher PIN':'Teacher verification'}</h2><p class="subtle">${setup?'Teacher: configure a PIN of at least four digits on this classroom device. Keep it private. ':''}This is a classroom control on a static website. It is not secure authentication: source answers and device data can be inspected. No centralized results or accounts.</p>${review?'<p>Review the written responses visible behind this window before authorizing the next mission.</p>':''}<form id="pinform"><label for="pin">${setup?'NEW PIN (4–12 DIGITS)':'TEACHER PIN'}</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4,12}" minlength="4" maxlength="12" required autocomplete="off"><div class="actions"><button class="primary">${setup?'SET PIN':'AUTHORIZE'}</button></div><p id="pinerror" role="status"></p></form>`);$('#pinform').onsubmit=async e=>{e.preventDefault();try{const h=await hash($('#pin').value);if(setup){db.settings.pinHash=h;persist();}else if(h!==db.settings.pinHash){$('#pinerror').textContent='Incorrect PIN.';return;}teacherSession=true;if(action){action();teacherSession=false;}else dashboard();}catch(err){$('#pinerror').textContent=err.message;}};}
function dashboard(){modal(`<p class="eyebrow">TEACHER DASHBOARD / THIS DEVICE</p><h2>Operation control</h2><p class="subtle">Close this panel before handing the device to students. The PIN discourages casual access; it does not secure a static site.</p><form id="settings"><div class="field"><label for="minutes">DURATION FOR NEW OPERATIONS</label><select id="minutes">${[10,15,17,20,25].map(n=>`<option ${db.settings.minutes===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label for="mode">VERIFICATION MODE</label><select id="mode"><option value="student">STUDENT MODE</option><option value="teacher" ${db.settings.teacherMode?'selected':''}>TEACHER VERIFIED MODE</option></select></div><div class="field"><label for="maxhints">MAX HINTS PER MISSION</label><select id="maxhints">${[0,1,2].map(n=>`<option ${db.settings.maxHints===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label for="soundsetting">SOUND</label><select id="soundsetting"><option value="off">OFF</option><option value="on" ${db.settings.sound?'selected':''}>ON</option></select></div><button class="primary">SAVE SETTINGS</button></form><div class="actions"><button id="localpdf">EXPORT LOCAL RESULTS (PDF)</button><button id="reviewlocal">REVIEW CURRENT TEAM</button><button id="newpin">CHANGE PIN</button><button id="wipe" class="danger">RESET ALL LOCAL PROGRESS</button></div>${state()?'<button id="applytime">APPLY SELECTED DURATION TO CURRENT TEAM</button>':''}<h3>Official answer key · teacher use only</h3>${levels.map((l,i)=>`<details><summary>LEVEL ${i+1} · CODE ${l.missions.map(m=>m.digit).join('')}</summary>${l.missions.map((m,j)=>`<p><strong>Mission ${j+1}: ${esc(m.title)}</strong><br>${esc(m.answer)}</p>`).join('')}</details>`).join('')}`);
$('#settings').onsubmit=e=>{e.preventDefault();db.settings.minutes=+$('#minutes').value;db.settings.teacherMode=$('#mode').value==='teacher';db.settings.maxHints=+$('#maxhints').value;db.settings.sound=$('#soundsetting').value==='on';persist();$('#sound').textContent=db.settings.sound?'SOUND ON':'SOUND OFF';if(db.settings.sound)tone();ambientSound();toast('Teacher settings saved.');};$('#localpdf').onclick=()=>{const keys=Object.keys(db.games);if(!keys.length)return toast('No local results yet.');downloadPDF('Secret_Code_Local_Results.pdf',keys.flatMap(i=>[...reportLines(+i),'','------------------------------------------------','']));};$('#reviewlocal').onclick=()=>{if(!state())return toast('Select a team first.');dialog.close();teacherSession=false;renderReport();};$('#applytime')?.addEventListener('click',()=>{if(!confirm('Reset the current team timer to the selected duration?'))return;const s=state();pause(s);s.duration=+$('#minutes').value*60;s.remaining=s.duration;persist();toast('Current timer updated.');});$('#newpin').onclick=()=>{modal('<h2>Change teacher PIN</h2><form id="newpinform"><label for="newpinvalue">NEW PIN (4–12 DIGITS)</label><input id="newpinvalue" type="password" inputmode="numeric" pattern="[0-9]{4,12}" required><div class="actions"><button>SAVE NEW PIN</button></div><p id="pinerror"></p></form>');$('#newpinform').onsubmit=async e=>{e.preventDefault();try{db.settings.pinHash=await hash($('#newpinvalue').value);persist();dashboard();}catch(err){$('#pinerror').textContent=err.message;}};};$('#wipe').onclick=()=>{if(confirm('Delete all teams, written work and progress stored on this device?')){db.games={};persist();dialog.close();teacherSession=false;renderHome();}};}
function resetGame(){if(!confirm('Reset this level? Saved answers, timer and progress for this team will be deleted.'))return;delete db.games[selected];persist();current=0;agencyForm();}
renderHome();

})();</script></body></html>
